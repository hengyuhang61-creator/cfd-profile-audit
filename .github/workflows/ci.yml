name: core-tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-cli:
    name: ${{ matrix.os }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install current project
        run: python -m pip install .
      - name: Run actual current package tests
        run: python -m unittest discover -s tests -v
      - name: Installed entry point and offline demonstration
        run: cfd-profile-audit demo --plot demo.svg --write-csv demo-data
      - name: Reject incomplete support on arbitrary CSV
        shell: python
        run: |
          import subprocess
          p = subprocess.run(['cfd-profile-audit', 'compare', 'demo-data/reference.csv', 'demo-data/computed.csv', '--coordinate', 'y', '--field', 'u'])
          assert p.returncode == 1, p.returncode
      - name: Recompute NASA derived station metrics
        run: cfd-profile-audit nasa --case duct --source derived --plot nasa.svg
